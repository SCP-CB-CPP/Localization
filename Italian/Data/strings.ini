finefirstaid.use.2 = Ti bendi le ferite e ti prendi un anti dolorifico, ma non sei stato in grado di fermare il sangue.
finefirstaid.use.3 = Hai bendato le ferite e preso un antidolorifico, ma senti ancora doloroe.
bluefirstaid.use.superman = Ti senti come un..... whooooo!!
bluefirstaid.use.invert = All’improviso, ti viene difficile girare la testa.
bluefirstaid.use.nausea = Ti senti nauseato.
bluefirstaid.use.heal = Ti bendi le ferite. Il sanguinamento si ferma completamente, ti senti bene.
bluefirstaid.use.hurt = Ti bendi le ferite. Del sangue incomincia a uscire attraverso le bende. 
veryfinefirstaid.use.fullheal = Le tue ferite si stanno curando velocemente.
veryfinefirstaid.use.hurt = Hai cominciato a sanguinare violentemente.
veryfinefirstaid.use.heal = Ti senti molto meglio.
