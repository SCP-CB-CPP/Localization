syringe.use = Ti inietti la siringa e senti un leggero colpo di adrenalina.
finesyringe.use = Ti inietti la siringa e senti un colpo di adrenalina.
veryfinesyringe.use.huge = Ti inietti la siringa e senti un forte colpo di adrenalina.
