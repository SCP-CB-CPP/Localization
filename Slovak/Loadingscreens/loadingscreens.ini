text1 = Nadácia SCP je organizácia venujúca sa zadržiavaniu a výskumu anomálnych predmetov a foriem života.
text2 = "My zabezpečujeme. My zadržujeme. My chránime." - Administrátor
text3 = "SCP" je skratka pre "Špeciálne Zadržiavacie Procedúry" (a oficiálne motto Nadácie, "Zabezpečiť, Zadržať, Chránit.") - čo zhrňuje ako ciele, tak metódy akcií Nadácie.