text1 = Personál triedy D sú osoby vykonávajúce testy na objektoch triedy Keter.
text2 = Personál triedy D je rekrutovaný z väzňov odsúdených na smrť. Hoci sú uprednostňované odsúdené osoby, uplatnenie Protokolu 12 umožňuje použitie zločincov, ktorí sa previnili menej závažne, spolu s nasadením civilného obyvateľstva.
text3 = Všetok personál triedy D je prvého dňa v mesiaci zlikvidovaný a ihneď nahradený. Ich názov je preto odvodený od slova Disposable - nahraditeľní.

