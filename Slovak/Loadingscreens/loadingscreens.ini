[Mobilní Ozbrojené Útvary]
image path = mtf.jpg
align x = center
align y = center
text1 = Mobilné Ozbrojené Útvary sú elitné jednotky zložené z pracovníkov z celej Nadácie a sú mobilizované na riešenie konkrétnych hrozieb alebo situácií, ktoré občas prekračujú prevádzkovú kapacitu alebo odborné znalosti terénneho personálu. 
text2 = Môžu byť premiestňované medzi zariadeniami alebo lokáciami podľa potreby. Členovia Mobilných zásahových útvarov predstavujú tých "najlepších z najlepších" z Nadácie.
text3 = MOÚ E-11 ("Deväťvrtá líška") zaisťuje vnútorné zabezpečenie Nadácie SCP pod dohľadom MOÚ Alfa-1. Ide o špeciálne operačné sily nasadzované, keď zlyhávajú štandardné protokoly a hrozí niekoľkonásobné narušenie. Väčšina ich činností je utajená.
text4 = Medzi ich úlohy patrí riešenie prelomenia zadržania opätovným zadržaním všech aktívnych a nepriateľských inštancií SCP, záchrana preživších zamestnancov Nadácie a likvidácia zvyšných členov personálu triedy D.

[Noktovizor]
image path = nvg.jpg
align x = right
align y = top
disablebackground = true
text1 = Štandardné noktovizory sú vydávané Mobilným Ozbrojeným Útvarom v prípade výpadku prúdu.
text2 = Sú tiež vydávané aj vedcom, ale je im odporúčané, aby sa v prípade výpadku prúdu zamerali na evakuáciu.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012 bolo získané Archeológom K.M. Sandovalom počas výkopov v severotalianskej hrobke zničenej búrkou. Objekt je kus ručne písanej hudobnej skladby nazvanej "Na Lebkovej hore", zdá se, že ide o väčší set papierov a vyzerá to, že je nekompletný.
text2 = Červený/čierny atrament, o ktorom sa najskôr myslelo, že ide o nejaký druh prírodného farbiva, bol neskôr identifikovaný ako ľudská krv z niekoľkých subjektov.
text3 = Počas následného vyšetrovania bolo niekoľkým testovacím subjektom dovolené vstúpiť do miestnosti s SCP-012. Vo všetkých prípadoch subjekty rýchlo zošaleli a pokúsili sa použiť vlastnú krv na dokončenie skladby, čo skončilo silnou stratou krvi a poškodením niekoľkých orgánov.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035 je biela porcelánová maska komédie, avšak občas sa zmení na tragédiu.
text2 = Keď je SCP-035 priložené na tvár jedinca, alternatívny vlnový vzorec z SCP-035 prehluší originálny, čo spôsobí mozgovú mŕtvicu subjektu. Subjekt potom tvrdí, že je vedomie uložené v SCP-035.
text3 = Psychologická analýza ukázala, že SCP-035 má veľmi manipulatívnu povahu a je schopné vynútiť vnímateľné zmeny v psychologickom stave zamestnancov Nadácie. SCP-035 je veľmi sadistické a donútilo niekoľko zamestnancov k spáchaniu samovraždy iba za pomoci svojich slov.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049 je humanoidná entita; napriek tomu Nadácia v súčasnosti nie je schopná podrobnejšie preskúmať jeho tvár a telo, pretože je pokryté tým, čo vyzerá ako odev tradičneho Morového doktora z 15. a 16. storočia v Európe.
text2 = Dotyk SCP-049 je pre ľudí vo všetkých prípadoch smrteľný. Po kontakte s rukou SCP-049 obeť (ďalej len SCP-049-2) utrpí [REDIGOVANÉ] a v priebehu niekoľkých okamihov zomrie.
text3 = SCP-049 potom vytiahne tašku vyrobenú z [REDIGOVANÉ] obsahujúcu skalpely, ihlu, niť a niekoľko fľaštičiek s doteraz neidentifikovanou látkou a začne SCP-049-2 pitvať a zároveň mu do tela vpravovať rôzne chemikálie.
text4 = Po približne 20 minútach sa SCP-049 podarí zošiť SCP-049-2 späť dohromady. Po niekoľkých ďalších začne SCP-049-2 opäť javiť znaky života.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066 je amorfná hmota z pletenej priadze a stužiek vážiaca približne jeden kilogram.
text2 = Po Incidentu 066-2 (pozri Záznam incidentu 066-2) začato SCP-066 vykazovať správanie vysoko nezlučiteľné s jeho predchádzajúcimi vlastnosťami. 
text3 = SCP-066 je teraz výrazne pohyblivejšie, čo sa týka hlavne jeho chápadlovitých častí. Okrem toho samovoľne vytvára zvuky a účinky v prítomnosti akejkoľvek osoby nehľadiac na to, či ho vnímajú naspäť.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079 je mikropočítač Exidy Sorcerer postavený v roku 1978.
text2 = Nie je známe, kedy presne nadobudlo SCP-079 vedomie, ale vie sa, že softvér sa vyvinul do bodu, kedy by hardvér nemal stačiť, ani v ríši fantázie.
text3 = Prešlo Turingovým testom a rado konverzuje, aj keď v drzom a nenávistnom tóne. Stále v sebe však prechováva pálčivú túžbu po úteku.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096 je normálne extrémne poslušné, tlakové senzory vo vnútri jeho cely indikujú, že väčšinu dňa trávi obcházením východnej steny.
text2 = Avšak, ak niekto zbadá tvár SCP-096, či už priamo, cez video nahrávku, alebo aj fotografiu, vstúpi SCP-096 do fázy značnej emočnej úzkosti.
text3 = Približne po jednej (1) až dvoch (2) minútach po prvom zbadaní sa SCP-096 rozbehne za osobou, ktorá videla jeho tvár.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106 je starší humanoid, ktorý zvyčajne vyzerá, akoby prechádzal pokročilým štádiom rozkladu. Jeho vzhľad sa môže líšiť, ale "hniloba" je pozorovateľná vo všetkých formách.
text2 = SCP-106 spôsobuje "korózny" efekt na každom pevnom materiáli, ktorého sa dotkne, a započne fyzickú degradáciu vo všetkých materiáloch niekoľko sekúnd po kontakte. To je pozorovateľné ako hrdzavenie, hniloba a praskanie materiálov spolu s tvorbou čiernej slizovitej látky podobnej tej, ktorá pokrýva SCP-106.
text3 = SCP-106 je schopné prechádzať cez pevné povrchy, pričom zanecháva veľké množstvo korozívneho slizu. SCP-106 je schopné "zmiznúť" do pevnej látky, pričom vstúpi do niečoho, o čom sa predpokladá, že je nejaká forma "vreckovej dimenzie".

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173 je vyrobené z betónu a železa s trochou Krylonového spreja. Je živé a extrémne nepriateľské.
text2 = Objekt sa nemôže pohybovať, keď je priamo pozorovaný. Očný kontakt s SCP-173 nesmie byť za žiadnu cenu prerušený. Členovia personálu, ktorí vstupujú do zadržiavacej miestnosti, musia jeden druhého upozorniť predtým, než mrknú.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 je pár reflektorov používaných pri fotografovaní. Svetlo vyžarované oboma lampami je pre SCP-205 jedinečné, pretože prechádza akýmkoľvek povrchom, ktorý nemá biele sfarbenie.
text2 = Pokiaľ svetlo z oboch lámp neprechádza cez materiál, vrhá tieň neznámej mladej ženy na akýkoľvek plochý biely povrch, ako je napríklad premietacie plátno v miestnosti 52.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-294 vyzerá ako štandardný automat na kávu, jediný rozdiel je veľká QWERTY klávesnica nahrádzajúca výberové menu.
text2 = Potom, čo sa do automatu vloží suma päťdesiatich centov americkej meny, užívateľ je vyzvaný, aby napísal meno akejkoľvek tekutiny. Po zadaní požiadavky SCP-294 vydá papierový kelímok s objemom troch decilitrov a doň pripraví požadovanú kvapalinu.
text3 = Prebehlo 97 testovacích požiadaviek (vrátane požiadaviek na vodu, kávu, pivo, sódu a tiež nepožívateľné tekutiny ako kyselina sírová, zmes do ostrekovačov a motorový olej, tiež požiadavky na látky, ktoré za normálnych podmienok nie sú kvapalné, napr. dusík, železo a sklo) a každá prebehla úspešne.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372 je stvorenie neznámeho pôvodu, približne dva metre dlhé od hlavy k chvostu, vážiace 45 kilogramov. Má dlhé, štíhle telo s ôsmimi pármi útlych nôh.
text2 = SCP-372 sa naučilo načasovať svoje pohyby v okolí akejkoľvek bytosti. Túto techniku používa na skrývanie, či už za hlavou osoby, ktorá ho hľadá, alebo v ich slepých bodoch a pri rýchlom pohybe očí.
text3 = V prípade prelomenia zadržania je všetok personál žiadaný, aby nahlásil akékoľvek krátke mihotavé pohyby v kútikoch očí.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 je malý, guľatý zdobený medailón z lešteného striebra. Ozdobné vzory, ktoré sú doň vryté, zjavne neplnia žiadny účel.
text2 = SCP-427 bolo vyrobené vložením pilulky SCP-500 do SCP-914 pri použití veľmi jemného stupňa. Ak je medailón zatvorený, nevykazuje žiadnu neobvyklú aktivitu. Po otvorení a vystavení organickej hmote začne neobvyklou rýchlosťou opravovať všetky poškodené bunky. Má tiež schopnosť zneškodniť akúkoľvek infekciu alebo podobnú látku či organizmus vstupujúci do tela.
text3 = Dlhodobé používanie SCP-427 je však zdraviu nebezpečné. Pri hojení hmoty tiež intenzívne posilňuje nervovú sústavu. Personál triedy D vystavený objektu dlhšie ako hodinu sa začal meniť na ťažko opísateľnú masu organickej hmoty.
text4 = Takto vznikajúci tvorovia sa ukázali byť nebezpeční a veľmi agresívni. Sú tiež veľmi odolní voči väčšine známych zbraní.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500 je malá plastová nádoba na lieky, ktorá v sebe má vo chvíli písania štyridsaťsedem (47) červených piluliek.
text2 = Jedna pilulka, ak je podaná orálne, efektívne vylieči všetky choroby subjektu do dvoch hodín, presný čas závisí od vážnosti a rozsahu.
text3 = Napriek rozsiahlym skúškam sa všetky pokusy syntetizovať viac aktívnych prísad piluliek stretli s nezdarom.

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true 
text1 = Fyzicky je SCP-513 nezaujímavý, hrdzavý kravský zvonec. Na jeho povrchu nie sú kvôli korózii viditeľné žiadne značky alebo rytiny.
text2 = Približne jednu hodinu po vystavení akémukoľvek hluku produkovanému SCP-513 začali obete zachytávať letmým pohľadom entitu opísanú ako SCP-513-1.
text3 = Všetky výsluchy doposiall indikovali, že SCP-513-1 je vysoký, vyziabnutý humanoid s abnormálne dlhými pažami.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682 je veľký neurčitý plaz neznámeho pôvodu. SCP-682 prechováva hlbokú nenávisť voči všetkému živému, čo preukázalo počas niekoľkých rozhovorov za čas, ktorý strávilo v zadržaní Nadácie.
text2 = SCP-682 má extrémnu silu, rýchlosť a reflexy, avšak presné údaje sa líšia v závislosti od formy. Regeneračné schopnosti SCP-682 sú ohromujúce a SCP-682 bolo zahliadnuté, ako sa pohybuje a hovorí, aj keď 87% jeho tela bolo zničených alebo odumretých.
text3 = SCP-682 musí byť čo najskôr zničené.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Zdánlivo iba zelený nefritový prsteň. SCP-714 sa však dokáže prispôsobiť veľkosťou tak, aby perfektne sedelo na prste kohokoľvek, kto sa ho dotkne, avšak to je jeho najmenej dôležitá vlastnost. 
text2 = Nosenie SCP-714 spôsobuje niekoľko závažných efektov, ako je vyčerpanie, nutkanie odpočívať/spať, pomalé reakcie, spomalená pohyblivosť a znížená mentálna kapacita.
text3 = Nositelia SCP-714 vykazujú zvýšenú toleranciu voči jedovatým či toxickým chemikáliám a abnormálne silnú odolnosť voči memetickým a mentálnym hrozbám.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 je tmavomodrý kľúč klasického tvaru.
text2 = V zdanlivo náhodných intervaloch sa na kľúči objaví rad čísel, neskôr zistené, že ide o UTM súradnice.
text3 = SCP-860 sa dá vložiť do akýchkoľvek dverí so zámkom v oblasti určenej súradnicami a bude fungovať rovnako ako správny kľúč pre vybrané dvere.
text4 = Keď je SCP-860 použité na odomknutie dverí, dvere nevedu k obvyklej destinácii. Namiesto toho vedú na malú lesnú mýtinu sústredenú na 80 cm širokej lesnej ceste, označenej SCP-860-1.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 je zdobená rakva z dubového dreva, získaná Nadačným personálom dňa [REDIGOVANÉ], z pohrebného ústavu [REDIGOVANÉ].
text2 = SCP-895 spôsobuje narušenie video a fotografických systémov v okruhu 50 metrov, ktoré sa podobá živým, znepokojujúcim halucináciám s rôznou dĺžkou trvania a intenzitou, podľa blízkosti zariadenia k SCP-895.
text3 = V blízkosti 5 metrov od SCP-895 môže zachytený obsah spôsobiť u väčšiny subjektov psychologickú traumu a hystériu.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 je veľké mechanické zariadenie vážiace niekoľko ton a pokrývajúce oblasť 18 metrov štvorcových, skladá sa zo skrutiek, pásov, páčok, ozubených kolies, pružín a ďalších mechanizmov.
text2 = Keď je do vstupnej kabíny vložený objekt, dvere sa zatvoria a zazvoní malý zvonček. Pokiaľ je gombík otočený do akejkoľvek pozície a je otočené kľúčom, SCP-914 "zdokonalí" predmet v kabíne. Počas procesu nedôjde ku strate žiadnej energie a objekt je zdokonalený v závislosti od nastavenia na hlavnom paneli SCP-914.
text3 = Je prísne zakázané vkladať akúkoľvek organickú hmotu dovnútra vstupnej komory SCP-914.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939 sú teplokrvné dravce, vykazujúce atrofiu orgánov, ktorá je charakteristická pre troglobiontické organizmy. Jedinci SCP-939 merajú priemerne 2,2 metra a ich váha sa pohybuje okolo 250 kilogramov, aj keď hmotnosť je veľmi variabilná.
text2 = Obľúbená metóda SCP-939, ako prilákať obeť, je napodobniť ľudskú reč hlasom predtým usmrtených obetí, hoci došlo k prípadom aktívneho nočného lovu a napodobňovania zvukov iných zvierat.
text3 = Obeť SCP-939 je zvyčajne usmrtená jediným uhryznutím do lebky alebo krku. Ich čeľuste sú schopné vyvinúť tlak prevyšujúci 35 MPa.

[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966 sú viditeľné iba pri vlnovej dĺžke medzi 700 nm a 900 nm. To platí pre všetko tkanivo SCP-966.
text2 = Ich loviaca taktika pozostáva z vydávania predtým neznámeho vlnového výboja, ktorý permanentne znemožní ovplyvnenej bytosti schopnost NREM a REM spánku. Schopnosť mikrospánku je rovnako stratená.
text3 = Potom, čo vyčerpá obeť nespavosťou, bude SCP-966 nasledovať svoju obeť, kým ju nedostatok spánku neznehybní. Potom SCP-966 svoju obeť skonzumuje.

[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970 je priestorový fenomén, ktorý spôsobuje, že sa množstvo miestností zacyklí samo do seba. Vo všetkých zatiaľ objavených prípadoch sa fenomén prejavil prostredníctvom dverí, ktoré sa objavili v stenách, vždy vo dvojici v protiľahlých stenách.
text2 = Zmeny spôsobené fenoménom nemajú žiadny efekt na susediace miestnosti ani priľahlé podlažia. V tento moment neexistuje vedecké vysvetlenie tohto fenoménu.
text3 = Od objavu fenoménu SCP-970 bolo nájdených [REDIGOVANÉ] ďalších prípadov fenoménu SCP-970, [REDIGOVANÉ]% z nich do 800 kilometrov od Oblasti-19.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 je kniha s tvrdými doskami obsahujúca približne 1 500 stránok. Obálka knihy a chrbát nesú nápis "Encyklopédia bežných chorôb".
text2 = Neboli nájdené žiadne ďalšie knihy od tohto vydavateľa, ani vydavateľstvo, alebo záznam o existencii vydavatelstva.
text3 = U čitateľov knihy sa objavia symptómy chorôb, o ktorých si prečítajú. Efekt se objaví medzi _ a __ hodinami od prečítania.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123 je ľudská lebka, ktorej chýba dolná čeľusť a všetky zuby. Cez čelnú kosť je moderné Khmérske písmo, napísané ľudskou krvou, ktoré sa prekladá ako "Spomeň si." 
text2 = Genetické testovanie potvrdilo, že obe sú od rovnakého jedinca. Khmérske písmo je ťažko vyblednuté a neviditeľné pre väčšinu subjektov vzdialených viac ako 5 metrov.
text3 = Vo vzdialenosti menšej ako 1 meter subjekty oznámili, že vyzerá ako čerstvo nakreslené. Niekoľko subjektov v tejto vzdialenosti oznámi, že je text "stále mokrý". Subjekty v tejto vzdialenosti budú často ohlasovať aj iné anomálne zmyslové javy.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = V súčasnosti je SCP-1162 diera v stene zo škvárobetónových tvárnic v Oblasti-[DATA VYMAZANÉ].
text2 = SCP-1162 sa aktivuje, keď vnímajúca bytosť siahne do otvorov. V tom okamihu sa jej prsty dotknú pevného povrchu pocitom podobným, ako je u SCP-1162 v jeho súčasnej lokácii. Potom bytosť objaví predmet dostatočne malý na to, aby sa pretiahol otvorom.
text3 = Tieto predmety boli celkovo opísané ako niečo, čo užívateľ stratil alebo čo v určitom okamihu svojho života hľadal.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499 je sovietska plynová maska typu GP-5. Test tesnosti vykonaný na objekte naznačuje, že si objekt zachováva svoju pôvodnú funkčnosť.
text2 = Anomálne účinky SCP-1499 sa aktivujú, keď si človek nasadí SCP-1499 na hlavu. Približne jednu sekundu po tom, čo je SCP-1499 plne zaistená na hlave subjektu, subjekt zmizne z dohľadu a stane sa nedetekovateľným.
text3 = Pri nosení SCP-1499 subjekty popisujú úplne odlišné prostredie, než v akom boli pred nosením SCP-1499.

[Povstanie Chaosu]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = Roku 1924 vytvorila Nadácia SCP špeciálnu tajnú údernú jednotku známu iba Rade O5 s krycím menom "Povstanie". Vedenie Povstania bolo zostavené zo členov MOÚ Alfa-1 ("Redá Pravá Ruka"), známej svojou lojalitou Rade O5 a totálnym utajením ich pôvodu, identít a operácií.
text2 = V roku 1948 "Povstanie" zaistilo niekoľko SCP objektov a s nimi aj dezertovalo z Nadácie. Zo zbehnutého bývalého MOÚ sa stala organizácia hovoriaca si: Povstanie Chaosu.
text3 = Jej hlavná operačná základňa je neznáma rovnako ako jej vodcovia. Táto organizácia je priamo v opozícii voči Nadácii a niekoľkokrát sa kvôli SCP dostala do otvoreného stretu. 
text4 = Personál je povinný byť informovaný o možných raziách, teroristických pokusoch a špiónoch z radov Povstania a informovať velenie o akomkoľvek podivném správaní kolegov.

