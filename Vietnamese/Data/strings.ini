[Option Tooltip]
; Graphics
vsync = "Đồng bộ khung hình" chờ màn hình hoàn tất chu kỳ làm mới hiện tại trước khi tính toán khung hình tiếp theo, ngăn ngừa các vấn đề như hiện tượng xé hình. Cơ chế này gắn tốc độ khung hình của trò chơi với tần số quét của màn hình và có thể gây ra một chút độ trễ đầu vào.
antialias = "Khử răng cưa" được sử dụng để làm mượt hình ảnh đã kết xuất trước khi hiển thị, nhằm giảm thiểu hiện tượng răng cưa ở các cạnh của mô hình.
gamma = "Độ sáng màn hình" được sử dụng để điều chỉnh độ sáng sao cho cân bằng với thông số gamma của màn hình, giúp khắc phục tình trạng hình ảnh trong game quá tối hoặc quá sáng. Việc thiết lập độ sáng quá cao hoặc quá thấp có thể làm giảm độ chi tiết của hình ảnh.
texlod = "Độ lệch mức độ chi tiết bề mặt" ảnh hưởng đến khoảng cách mà tại đó độ chi tiết của bề mặt sẽ thay đổi để ngăn ngừa hiện tượng răng cưa. Thay đổi tùy chọn này nếu bề mặt bị nhấp nháy hoặc trông quá mờ.
vram = Các bề mặt được lưu trữ trong card đồ họa sẽ tải nhanh hơn, nhưng điều này cũng gây ảnh hưởng tiêu cực đến chất lượng của chúng.
hudoffset = "Dịch chuyển giao diện" được sử dụng để di chuyển các thanh hiển thị thể lực và mắt, cũng như các thông tin của nhiều vật phẩm khác nhau về phía trung tâm màn hình. Tính năng này chủ yếu dành cho các màn hình siêu rộng.
viewbob = "Lắc camera" kiểm soát mức độ dịch chuyển và nghiêng của camera khi di chuyển.
fov = "Trường nhìn" là phạm vi tầm nhìn trong trò chơi được hiển thị trong quá trình chơi.

; Audio
musicvol = Điều chỉnh âm lượng nhạc nền. Kéo thanh trượt hết cỡ sang trái sẽ tắt toàn nhạc.
soundvol = Điều chỉnh âm lượng của các hiệu ứng âm thanh. Kéo thanh trượt hết cỡ sang trái sẽ tắt toàn bộ âm thanh.
localaudio = Chuyển đổi giữa việc sử dụng âm thanh gốc (tiếng Anh) cho các câu thoại và âm thanh lồng tiếng.
subtitles = Hiển thị văn bản ở cuối màn hình cho phần thoại đang phát.
closedcaptions = Hiển thị văn bản ở cuối màn hình để mô tả các hiệu ứng âm thanh đang phát.
sfxautorelease = "Tự động nhả âm thanh" sẽ giải phóng âm thanh khỏi bộ nhớ nếu nó không được sử dụng sau 5 giây. Tính năng này giúp ngăn ngừa các vấn đề về cấp phát bộ nhớ.
usertrack = Bật/tắt tính năng phát các bài nhạc tùy chỉnh trên kênh 1 của radio. Các bài nhạc này được lấy từ thư mục "SFX\Radio\UserTracks\". Nhấn phím "1" khi đang chọn đài để chuyển bài.
usertrackmode = Thiết lập chế độ phát cho các bản nhạc tùy chỉnh. Chế độ "Lặp lại" phát từng tệp theo thứ tự bảng chữ cái. Chế độ "Ngẫu nhiên" chọn ngẫu nhiên bài nhạc tiếp theo.
usertrackmode.note = Lưu ý rằng chế độ ngẫu nhiên không ngăn các bài hát đã phát trước đó lặp lại.
usertrackscan = Kiểm tra lại thư mục chứa các bản nhạc của người dùng để phát hiện các tệp âm thanh mới hoặc đã bị xóa.

; Controls
mousesensitivty = Điều chỉnh tốc độ của con trỏ chuột.
mousesmoothing = Điều chỉnh mức độ mượt của con trỏ chuột.
binds = Điều chỉnh nút điều khiển trong trò chơi.

; Advanced
showhud = Hiển thị thanh mắt và thanh thể lực.
console = Bật/tắt việc sử dụng bảng lệnh. Có thể sử dụng trong trò chơi bằng cách nhấn {0}.
console.note = Việc sử dụng bảng lệnh sẽ vô hiệu hóa các thành tựu của Steam.
speedrunmode = Hiển thị bộ đếm thời gian và thay đổi cách theo dõi thời gian chơi để đáp ứng các yêu cầu của chế độ speedrun.
numericseeds = Cho phép nhập hạt giống dưới dạng số nguyên để tạo trực tiếp bộ tạo số ngẫu nhiên nội bộ của trò chơi. Nếu không nhập hạt giống, hệ thống sẽ sử dụng số mili-giây đã trôi qua kể từ khi máy tính khởi động.
achpopup = Hiển thị thông báo dạng pop-up khi mở khóa được một thành tựu.
launcher = Cho phép kích hoạt lại trình khởi chạy nếu nó đã bị vô hiệu hóa.
showfps = Hiển thị bộ đếm khung hình mỗi giây ở góc trên bên trái.
framelimit = Giới hạn tốc độ khung hình của trò chơi ở mức mong muốn.
framelimit.note = Thông thường, mức 60 khung/giây trở lên là lý tưởng. Nếu bạn thấy hiện tượng giật lag quá mức ở mức thiết lập này, hãy thử giảm xuống để có tốc độ khung hình ổn định hơn.

