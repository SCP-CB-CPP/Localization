[Death Message]
008 = D-9341 bị phát hiện đang ăn thịt Tiến sĩ [ĐÃ BỊ XÓA] tại Khu vực [ĐÃ BỊ XÓA]. Đối tượng lập tức bị lực lượng Nine-Tailed Fox tiêu diệt và được chuyển đi khám nghiệm tử thi. Kết quả xác nhận đối tượng nhiễm SCP-008, sau đó thi thể đã bị hỏa táng.
008.gate = D-9341 được phát hiện đang lang thang quanh {0}. Đối tượng lập tức bị đội Nine-Tailed Fox tiêu diệt và được chuyển đi khám nghiệm tử thi. Kết quả xác nhận đối tượng nhiễm SCP-008, sau đó thi thể đã bị hỏa táng.
008.gate.a = Cổng A
