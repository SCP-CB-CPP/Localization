008zombie = D-9341. Nguyên nhân tử vong: nhiều vết rách và chấn thương do lực va đập mạnh gây ra bởi [DỮ LIỆU BỊ XÓA], kẻ đã nhiễm SCP-008. Đối tượng này đã bị đội Nine-Tailed Fox phát hiện và tiêu diệt.
012 = D-9341 được tìm thấy nằm trong vũng máu cạnh SCP-012. Có vẻ như đối tượng đã tự rạch cổ tay và viết thêm ba dòng nữa vào bản nhạc trước khi tử vong do mất máu.
035.chamber = D-9341 được phát hiện đã tử vong bên trong buồng của SCP-035. Đối tượng có biểu hiện xuất huyết nghiêm trọng ở các mạch máu quanh vùng mắt cũng như bên trong khoang miệng và mũi. Thi thể đã được chuyển đi để khám nghiệm tử thi.
035.tentacle = "Chúng tôi cần hơn chỉ đội vệ sinh thông thường để xử lý việc này. Có vẻ như hai xúc tu cỡ lớn cực kỳ hung hãn đã hình thành bên trong buồng chứa. Mức độ hung hãn của chúng vượt xa bất cứ thứ gì chúng ta từng chứng kiến ​​trước đây – dường như chúng đã đánh chết một nhân sự Cấp D xấu số nào đó."
035.tentacle.office = "Một xúc tu lớn, cực kỳ hung hãn dường như đã mọc ra từ xác chết của một nhà khoa học tại khu vực văn phòng [ĐÃ BỊ XÓA]. Mức độ hung hãn của nó vượt xa bất cứ thứ gì chúng ta từng chứng kiến ​​trước đây – có vẻ như nó đã đánh chết một nhân sự Cấp D xấu số nào đó."
049 = Một cá thể SCP-049-2 đang hoạt động đã được phát hiện tại [ĐÃ BỊ XÓA]. Đã bị tiêu diệt bởi đội Nine-Tailed Fox.
049.chamber = Ba cá thể SCP-049-2 đang hoạt động đã được phát hiện trong đường hầm bên ngoài buồng của SCP-049. Chúng đã bị đội Nine-Tailed Fox tiêu diệt.
0492 = D-9341. Nguyên nhân tử vong: nhiều vết rách và chấn thương do lực va đập mạnh, gây ra bởi một cá thể SCP-049-2.
096 = Phát hiện một lượng lớn máu tại [DỮ LIỆU BỊ XÓA]. Kết quả phân tích DNA xác định đó là máu của D-9341. Rất có thể [DỮ LIỆU BỊ XÓA] bởi SCP-096.
106.pd = D-9341. Thi thể bị phân hủy một phần do thứ được cho là hiệu ứng "ăn mòn" của SCP-106. Thi thể đã được tiêu hủy bằng phương pháp hỏa táng.
106.pd.crushed = Ngoài vẻ ngoài phân hủy đặc trưng thường thấy ở các nạn nhân của SCP-106, thi thể còn có những vết thương chưa từng được ghi nhận trước đây: nứt vỡ hộp sọ nghiêm trọng, gãy ba xương sườn, gãy xương vai và nhiều vết rách sâu.
106.pd.fall = Ngoài vẻ ngoài bị phân hủy đặc trưng ở các nạn nhân của SCP-106, đối tượng dường như còn bị gãy xương nghiêm trọng ở cả hai chân.
173 = D-9341. Nguyên nhân tử vong: Gãy đốt sống cổ. Nghi bị SCP-173 tấn công.
173.camera = D-9341. Nguyên nhân tử vong: Gãy đốt sống cổ gây tử vong. Các đoạn băng giám sát xác nhận rằng đối tượng đã bị SCP-173 giết chết.
173.intro = D-9341. Nguyên nhân tử vong: Gãy đốt sống cổ. Theo lời Trưởng bộ phận An ninh Franklin – người có mặt tại buồng SCP-173 vào thời điểm xảy ra sự cố – đối tượng đã bị SCP-173 sát hại ngay khi hệ thống điện bắt đầu gặp trục trặc.
173.doors = "Nếu tôi không nhầm thì một trong những mục đích chính của mấy căn phòng này là ngăn SCP-173 di chuyển xa hơn trong trường hợp xảy ra sự cố. Thế mà, ai lại lắp một cái ống thông gió to đùng — đủ rộng cho cả người chui lọt — vào trong đó vậy?"
205 = Chu kỳ của SCP-205 dường như đã trở lại trạng thái bình thường sau những hiện tượng bất thường được ghi nhận trong sự kiện [ĐÃ BỊ XÓA]. Thi thể của D-9341 được tìm thấy bên trong buồng. Đối tượng có các dấu hiệu chấn thương do va đập mạnh, điển hình ở những nhân sự từng bước vào buồng khi đèn đang tắt.
420js = D-9341 được tìm thấy trong tình trạng hôn mê tại [DỮ LIỆU BỊ XÓA]. Đối tượng đang cầm một vật trông giống như điếu thuốc lá trong khi nở nụ cười tươi. Kết quả phân tích hóa học đối với điếu thuốc chưa đưa ra được kết luận cụ thể, mặc dù nó dường như chứa nồng độ cao một loại hóa chất chưa xác định có cấu trúc phân tử cực kỳ giống với tetrahydrocannabinol.
427 = "Yêu cầu hỗ trợ từ MTF Nu-7. Chúng tôi cần thêm hỏa lực để hạ gục thứ này."
895 = "Điều chúng tôi biết là anh ta đã tử vong do ngừng tim. Chúng tôi cho rằng nguyên nhân là do SCP-895, mặc dù trước đây chưa từng ghi nhận trường hợp nó gây ảnh hưởng đến thiết bị quay phim từ khoảng cách xa như vậy. Cần tiến hành thêm các thử nghiệm để xác định xem liệu "Vùng Đỏ" của SCP-895 có đang mở rộng hay không."
895.nvg = "Đối tượng Cấp D đã quan sát SCP-895 qua một cặp kính nhìn đêm, dẫn đến việc anh ấy bị giết."
895.finenvg = "Đối tượng Cấp D đã quan sát SCP-895 thông qua một cặp kính nhìn đêm, có khả năng đã được SCP-914 cải tiến. Có thể đối tượng đã chống lại được một phần các tác động nhận thức nhờ vào chiếc kính này. Chiếc kính hiện đã được lưu kho để phục vụ nghiên cứu thêm."
914.rough = "Một thi thể bị biến dạng nghiêm trọng đã được tìm thấy bên trong buồng đầu ra của SCP-914. Kết quả xét nghiệm DNA xác định thi thể này là đối tượng Cấp D mang mã số D-9341. Rõ ràng đối tượng đã bị SCP-914 "tinh chế" ở chế độ "Thô", nhưng chúng tôi vẫn chưa rõ làm thế nào anh ấy lại lọt vào bên trong buồng đầu vào, cũng như ai hoặc thứ gì đã vặn chìa khóa khởi động máy."
914.superman = Một bộ đồ của nhân sự Cấp D được tìm thấy tại [DỮ LIỆU BỊ XÓA]. Qua kiểm tra kỹ hơn, người ta phát hiện bên trong bộ đồ chứa 12,5 kg một loại vật chất màu xanh lam có dạng như tro. Kết quả phân tích hóa học về loại vật chất này vẫn chưa đưa ra được kết luận cụ thể. Nhiều khả năng nó có liên quan đến SCP-914..
939 = "Cả bốn cá thể SCP-939 trốn thoát đều đã bị bắt giữ và tái quản thúc thành công. Ba trong số đó đã gây ra một mớ hỗn độn tại Khu vực Lưu trữ 6. Một đội vệ sinh đã được điều động đến hiện trường."
1025.cardiacarrest = "Chắc chắn là anh ấy đã tử vong do ngừng tim sau khi đọc SCP-1025. Liệu có tồn tại hiện tượng ngừng tim do yếu tố tâm lý-thể chất hay không, hay SCP-1025 sở hữu những đặc tính dị thường nào đó mà chúng ta chưa hề hay biết?"
1123 = D-9341 đã bị bắn hạ sau khi cố gắng tấn công một thành viên thuộc đội đặc nhiệm Nine-Tailed Fox. Các đoạn băng giám sát cho thấy đối tượng đã đi lại quanh khu vực này khoảng 9 phút trước đó và hét lớn cụm từ "diệt trừ bốn loài gây hại" bằng tiếng Trung. SCP-1123 được tìm thấy tại [BỊ XÓA] gần đó, cho thấy đối tượng đã có tiếp xúc vật lý với dị thể này. Hiện vẫn chưa rõ chính xác làm thế nào SCP-1123 lại bị đưa ra khỏi buồng.
1048a = Một thi thể phủ đầy tai đã được tìm thấy tại [ĐÃ BỊ XÓA]. Nạn nhân được cho là đã bị một cá thể SCP-1048-A tấn công và tử vong do ngạt thở bởi chính những chiếc tai đó. Thi thể đã được chuyển đi khám nghiệm tử thi.
1162 = Một đối tượng Cấp D đã tử vong được phát hiện bên trong buồng của SCP-1162. Kết quả khám nghiệm tử thi cho thấy phổi phải của đối tượng đã biến mất, điều này gợi ý về sự tương tác với SCP-1162.
1499 = Hiện vẫn chưa rõ tung tích của SCP-1499, nhưng một đội trinh sát đã được phái đi điều tra các báo cáo về một vụ tấn công bạo lực nhắm vào một nhà thờ tại thị trấn [ĐÃ BỊ XÓA] của Nga.
14991 = Một người đàn ông chưa xác định danh tính cùng thi thể của một đối tượng Cấp D đã được đội Nine-Tailed Fox phát hiện tại [ĐÃ BỊ XÓA]. Người đàn ông này được mô tả là đang trong trạng thái vô cùng kích động và dường như chỉ nói tiếng Nga. Đối tượng đã được đưa đến khu vực giam giữ tạm thời tại [ĐÃ BỊ XÓA] trong khi chờ phiên dịch viên đến nơi.
14991.dimension = Tất cả nhân sự có mặt tại Khu trú ẩn Sơ tán LC-2 trong thời điểm xảy ra sự cố đã được cho sử dụng thuốc xóa trí nhớ Cấp độ B do Sự cố 1499-E. Đối tượng Cấp độ D liên quan đến sự việc đã tử vong ngay sau khi bị Đặc vụ [ĐÃ BỊ XÓA] bắn.
guard.intro = D-9341. Nguyên nhân tử vong: Vết thương do đạn bắn vào đầu. Các đoạn băng giám sát xác nhận rằng đối tượng đã bị Đặc vụ Ulgrin tiêu diệt ngay sau khi lệnh phong tỏa cơ sở được ban hành.
guard.gate.b = "Đặc vụ G, báo cáo về trung tâm chỉ huy. Đã tiêu diệt một đối tượng Cấp D trốn thoát tại sân Cổng B."
apache = "CH-2 gọi Trung tâm. Đã hạ gục một đối tượng Cấp D đang bỏ trốn tại {0}."
apache.gate.a = Cổng A
apache.gate.b = Cổng B
ntf = D-9341. Bị Đội Đặc nhiệm Nine-Tailed Fox tiêu diệt.
ntf.bloodloss = D-9341. Tử vong do mất máu sau khi bị lực lượng Nine-Tailed Fox bắn.
tesla = D-9341 đã thiệt mạng bởi cổng Tesla tại [ĐÃ BỊ XÓA].
killbat = D-9341 được phát hiện đã tử vong bên trong buồng đầu ra của SCP-914, ngay cạnh vật thể trông giống như một viên pin 9-volt thông thường. Cơ thể đối tượng có nhiều vết bỏng điện nghiêm trọng; nguyên nhân tử vong được cho là do điện giật từ viên pin này. Viên pin đã được lưu giữ để phục vụ công tác nghiên cứu thêm.
suicide_1 = [ĐÃ BỊ CHE DẤU]
suicide_2 = D-9341 được phát hiện đã tử vong tại Khu vực [ĐÃ BỊ CHE GIẤU]. Cơ thể đối tượng dường như không có tổn thương vật lý nào, và không có dấu hiệu rõ ràng nào cho thấy nguyên nhân gây tử vong. Thi thể đã được chuyển đi khám nghiệm.
suicide_3 = Nguyên nhân tử vong : 404
suicide_4 = D-9341 được phát hiện đã tử vong tại Khu vực [ĐÃ BỊ CHE GIẤU]. Đối tượng dường như đã dùng chính máu của mình để viết nguệch ngoạc dòng chữ "44" ngay bên cạnh. Không ghi nhận dấu hiệu nào khác về chấn thương vật lý hay dấu vết giằng co. Thi thể đã được chuyển đi khám nghiệm tử thi.
gassed = D-9341 được tìm thấy đã tử vong tại [DỮ LIỆU BỊ XÓA]. Nguyên nhân tử vong: Ngạt thở do khí khử nhiễm.

