pill.use.healnausea = 알약을 삼켰다. 메스꺼움이 가라앉았다.
cigarette.use.unable = 불을 붙일 수가 없다.
cigarette.use_1 = "불을 붙일 만한 게 없네. 음, 저걸로 어떻게 하면... 아니다."
cigarette.use_2 = "끊은지 오래 됐다."
cigarette.use_3 = "한대 피우고 싶어도, 불을 붙일만한 게 없어."
cigarette.use_4 = "진짜 한 대만 피우고 싶네... 라이터가 있었으면 좋았을텐데."
cigarette.use_5 = "아무리 이런 상황이라고 해도 손대고 싶진 않아."
420j.use.714 = "야 뭐임 이 씨부랄거 듣지를 않잖아"
420j.use = "야 이거 존나게 죽여주는 물건이네!"
420j.use.nap = "여기가 어디지... 내가 뭘 하고 있었더라... 야 나 너무 졸려..."
427.on = 로켓을 열었다.
427.off = 로켓을 닫았다.
1162.use.badge = "엥? 이 사람 나랑 똑같이 생겼네!"
1162.use.key = "이거 그 낡은 오두막 열쇠 아닌가? 내 예전... 아니, 그럴 리 없지."
1162.use.hearing = "이게 왜 이렇게 익숙하게 느껴지지?"
1162.use.ticket = "아, 나 이 영화 기억해!"
066.killbat = 끈끈이가 배터리를 안전하게 집을 수 있게 도와주었다.
bonefragment = {0}/{1} 개의 뼈 조각을 얻었다.
eyecandy.use = 사탕을 삼켰다. 시큼하고 짜릿한 맛이다. 근처에 다른 존재가 느껴진다.
eyecandy.use.shock = 사탕을 입에 넣으려 했으나, 전기 충격이 가해졌다.
lollipop.use = 롤리팝을 먹었다. 호박 파이 맛이 난다.
lollipop.use.numb = 롤리팝을 먹었다. 아무 맛도 느껴지지 않는다.
chocolate.use = 초콜릿 바를 먹었다. 부패한 맛이 난다.
chocolate.use.numb = 초콜릿 바를 먹었다. 아무런 맛도 느껴지지 않는다. 
candy.nouse = 지금은 그 행동이 잘 되지 않는다.

[Message Help]
paper = 책상 위의 종이를 집으십시오.
inventory = 인벤토리를 열려면 {0}키를 누르십시오.
view = 문서를 보려면 두 번 클릭하십시오.
blink = 눈을 깜빡이려면 {0}키를 누르십시오.
run = 달리려면 {0}키를 누르십시오.
remove = 이 아이템을 제거하려면 두 번 클릭하십시오.

[Message Save]
anywhere = 저장하려면 {0}키를 누르십시오.
screens = 시설 곳곳에 있는 상호작용 가능한 모니터에서만 저장할 수 있습니다.
disabled = 빠른 저장 기능이 비활성화되었습니다.
disabled.location = 이 장소에서는 저장할 수 없습니다.
disabled.moment = 지금은 저장할 수 없습니다.
disabled.loading = 지금은 저장할 수 없습니다. (게임이 로딩중입니다)
saved = 게임 진행 상황 저장됨.

[Message Shot]
neck = 목에 총알이 강타했다. 숨이 턱 막힌다.
chest = 가슴에 총을 맞았다. 숨이 턱 막힌다.
chest.vest = 총알이 방탄 조끼를 관통했다. 숨이 턱 막힌다.
chest.finevest.light = 가슴에 총을 맞았지만, 방탄 조끼가 대부분의 충격을 흡수했다.
chest.finevest.heavy = 가슴에 총을 맞았지만, 방탄 조끼가 약간의 충격을 흡수했다.
leftleg = 왼쪽 다리에 총을 맞았다.
rightleg = 오른쪽 다리에 총을 맞았다.
rightshoulder = 오른쪽 어깨에 총을 맞았다.
leftshoulder = 왼쪽 어깨에 총을 맞았다.

[Death Message]
008 = D계급 인원 D-9341이 섹터-[편집됨]에 있는 [편집됨]박사를 섭취하고 있는 것이 발견되었다. 대상은 구미호 부대에 의해 즉시 사살되었으며, 부검을 위해 이송되었다. SCP-008에 의한 감염이 확인되었고, 이후 시체는 소각되었다.
008.gate = D계급 인원 D-9341이 {0} 주변을 배회하는 것이 발견되었다. 대상은 구미호 부대에 의해 즉시 사살되었으며 부검을 위해 이송되었다. SCP-008에 의한 감염이 확인되었고, 이후 시체는 소각되었다.
008.gate.a = A 게이트
008.gate.b = B 게이트
008zombie = D계급 인원 D-9341. 사망 원인: SCP-008에 감염된 [데이터 말소]에 의한 다수의 열상 및 둔상. 대상은 구미호 부대에 의해 발견되어 사살되었다.
012 =  D계급 인원 D-9341이 SCP-012 옆의 피 웅덩이 속에 쓰러진채 발견되었다. 대상은 자신의 손목을 직접 찢은 것으로 보이며, 과다출혈로 사망하기 전까지 악보에 세 줄을 더 적어 넣은 것으로 보인다.
035.chamber = D계급 인원 D-9341이 SCP-035의 격리실 내부에서 사망한 채 발견되었다. 대상은 눈 주변과 구강, 비강 내부의 혈관에서 심각한 출혈을 보이고 있었다. 부검을 위해 이송되었다.
035.tentacle = "이걸 처리하려면 일반적인 청소팀만으로는 부족할 것 같습니다. 격리실 내부에는 거대하고 활동적으로 움직이는 촉수 형태의 기관이 두 개 생성된 것으로 보입니다. 그 공격성은 지금까지 본 그 어떤 것과도 비교할 수 없을 정도입니다. 격리 실패 당시 불운한 D계급 인원 몇 명을 때려죽인 것으로 보입니다."
035.tentacle.office = "[편집됨]구역 내 사무실 공간에서 사망한 과학자의 시체에서 거대하고 활동적으로 움직이는 촉수 형태의 기관이 돋아난 것으로 보입니다. 이 개체의 공격성은 지금까지 본 그 어떤 것과도 비교할 수 없을 정도입니다. 격리 실패 당시 불운한 D계급 인원 몇 명을 때려죽인 것으로 보입니다."
049 = [편집됨]에서 움직이는 SCP-049-2 개체가 발견되었다. 해당 개체는 구미호 부대에 의해 사살되었다. 
049.chamber = SCP-049의 격리실 외부 터널에서 SCP-049-2 개체 3구가 발견되었다. 해당 개체들은 구미호 부대에 의해 사살되었다.
0492 = D계급 인원 D-9341. 사망 원인: SCP-049-2개체에 의한 다수의 열상 및 심각한 둔상.
096 = [데이터 말소]에서 다량의 혈흔이 발견되었다. DNA분석 결과 D계급 인원 D-9341의 것으로 확인되었다. SCP-096의 [데이터 말소됨]에 의한 것일 가능성이 높다.
106.pd = D계급 인원 D-9341. SCP-106의 '부식' 효과로 추정되는 현상에 의해 시신이 부분적으로 분해됨. 시신은 소각을 통해 처리함.
106.pd.crushed = 해당 시신에서는 SCP-106의 희생자들에게 흔히 나타나는 부패 이외에도 이전에 관찰된 적 없는 심각한 두개골 골절, 3대의 갈비뼈 골절, 어깨 골절, 그리고 다수의 깊은 열상과 같은 부상들이 확인되었다.
106.pd.fall = 대상은 SCP-106의 희생자들에게 흔히 나타나는 부패 이외에도 양쪽 다리에 여러 심각한 골절을 입은 것으로 보인다.
173 = D계급 인원 D-9341. 사망 원인: 심각한 경추 골절. SCP-173의 공격을 받은 것으로 추정됨.
173.camera = D계급 인원 D-9341. 사망 원인: 심각한 경추 골절. 감시카메라 기록에 의해 SCP-173에 의해 살해당한 것을 확인함.
173.intro = D계급 인원 D-9341. 사망 원인: 심각한 경추 골절. 격리 실패 당시 SCP-173의 격리실에 있었던 보안 담당자 프랭클린에 따르면, 대상은 전력망에 이상이 발생하자마자 SCP-173에게 살해당함.
173.doors = "내 기억이 맞다면, 이 방의 주된 목적 중 하나는 격리 실패 시 SCP-173이 더 이상 이동하지 못하도록 막는 것이었을 겁니다. 그러니까, 이 빌어먹을 사람만한 크기의 배관을 설치하기로 한 건 도대체 누구의 천재적이신 아이디어랍니까?"
205 = [편집됨] 당시 관측된 변칙 현상 이후, SCP-205의 주기는 다시 원래대로 돌아간 것으로 보인다. 격리실 내부에서 D계급 인원 D-9341의 시신이 발견되었다. 대상의 몸에서는 조명이 꺼진 상태로 격리실에 진입하는 인원에게서 흔히 나타나는 둔상의 흔적이 발견되었다.
330 = SCP-330이 회수된 [편집됨] 근처에서 D계급 인원 D-9341이 양 손이 절단된 채 사망한 것이 발견되었다. 해당 개체와의 상호작용으로 인해 사망한 것으로 추측된다.
420js = D계급 인원 D-9341이 [데이터 말소됨]에서 혼수상태로 발견되었다. 발견 당시 대상은 담배로 추정되는 물건을 든 채 환하게 웃고 있었다. 해당 담배에 대한 화학적 분석 결과는 명확한 결론이 나지 않았으나, 테트라하이드로칸나비놀과 매우 유사한 분자 구조를 가진 미확인 화학물질이 고농도로 함유되어 있는 것으로 보인다.
427 = "기동특무부대 뉴-7에 지원을 요청한다. 이걸 쓰러뜨리려면 더 많은 화력이 필요하다."
895 = "그가 심정지로 삼아했다는 사실은 확인되었습니다. 제 추측으로는 SCP-895가 원인인 듯 합니다만, SCP-895가 이 정도로 먼 거리에서 영상 기기에 영향을 끼친 경우는 이전까지 관찰된 적이 없습니다. SCP-895의 레드 존(Red Zone)이 확장되고 있는 것인지 확인하기 위해 추가적인 실험이 필요합니다."
895.nvg = "D계급 인원이 디지털 야간 투시경을 통해 SCP-895를 바라봤고, 그 결과 사망한 것으로 보인다."
895.finenvg = "D계급 인원은 SCP-914로 인해 강화된 것으로 추정되는 디지털 야간 투시경을 착용하고 SCP-895를 바라본 듯 하다. 대상이 이 야간 투시경 덕분에 밈적인 영향에 부분적으로 저항했을 가능성이 있다. 해당 야간 투시경은 추가 연구를 위해 회수하였다."
914.rough = "SCP-914의 배출 칸막이 내부에서 심하게 훼손된 시신을 발견했다. DNA 검사 결과 해당 시신은 D등급 인원 D-9341인 것으로 확인되었다. 대상은 SCP-914의 '굵음' 설정에 의해 '정제'된 상태였으나 그가 어떻게 투입 칸막이 내부로 들어가게 되었는지, 그리고 누가 혹은 무엇이 이 태엽의 열쇠를 돌렸는지는 여전히 의문이다."
914.superman = [데이터 말소]에서 D계급 점프슈트가 발견되었다. 조사 결과 해당 점프슈트 안은 푸른색 재와 유사한 물질 12.5kg으로 채워져 있었다. 해당 물질에 대한 화학적 분석 결과는 명확한 결론이 나지 않았다. SCP-914와 관련되어 있을 가능성이 높다. 
939 = "탈출했던 SCP-939 개체 4마리 모두를 성공적으로 포획하어 재격리하였습니다. 그 중 3마리가 6번 보관 구역에서 상당한 난장판을 벌여놓은 걸로 보입니다. 현재 청소 팀을 파견한 참입니다."
1025.cardiacarrest = "그는 SCP-1025를 읽은 뒤 심정지로 사망한 것이 확실합니다. 심인성 심정지같은 것이 세상에 존재하거나, 아니면 SCP-1025에 우리가 아직 알지 못하는 변칙성이 있는 걸까요?"
1123 = D계급 인원 D-9341은 구미호 대원을 공격하려다 사살되었다. 감시카메라 영상에 따르면, 피험자는 사건 발생 약 9분 전부터 시설 내부를 배회하며 중국어로 "사해를 죽여라"는 구호를 외치고 있었다. [편집됨] 근처에서 SCP-1123이 발견된 점으로 봐서, 피험자가 해당 객체와 직접 접촉했던 것으로 보인다. SCP-1123이 어떻게 격리실에서 반출되었는지는 아직 밝혀지지 않았다.
1048a = [편집됨]에서 귀로 뒤덮인 시체가 발견되었다. 대상은 SCP-1048-A개체 중 하나에게 공격받아, 몸에서 자라난 귀로 인해 질식사한 것으로 추정된다. 시신은 부검을 위해 이송하였다.
1162 = SCP-1162 격리실 내부에서 사망한 D계급 인원이 발견되었다. 부검 결과 대상의 오른쪽 폐가 사라진 것으로 밝혀졌고, 이는 대상이 SCP-1162와 상호작용을 했음을 시사한다.
1499 = SCP-1499의 행방은 여전히 불명이나, 러시아의 [편집됨] 마을에 위치한 어느 교회에서 발생한 폭력 사태에 관해 조사하기 위해 정찰팀이 파견되었다.
14991 = [편집됨]에서 구미호 부대에 의해 신원 미상의 남성 1명과 사망한 D계급 인원 1명이 발견되었다. 해당 남성은 매우 격양된 상태였으며 러시아어밖에 할 줄 모르는 것으로 보였다. 통역사가 도착할 때까지 임시적으로 [편집됨]에 마련된 장소에 격리하는 중이다.
14991.dimension = 사건 1499-E와 관련해 격리 실패 당시에 대피소 LC-2 내부에 있었던 모든 인원에게 기억소거제가 투여되었다. 해당 사건에 휘말린 D계급 인원은 [편집됨] 요원의 총격을 받은 직후 사망하였다.
guard.intro = D계급 인원 D-9341. 사망 원인: 머리에 입은 총상. 감시카메라 영상 확인 결과, 대상은 기지 봉쇄가 일어난 직후 울그린 요원에 의해 사살됨.
guard.gate.b = "요원 G가 본부에 알림. B게이트 지상 구역에서 탈출한 D등급 인원 1명을 사살함."
apache = "CH-2가 본부에 알림. {0}에서 도망치는 D계급을 쏴서 제압함."
apache.gate.a = A게이트
apache.gate.b = B게이트
ntf = D계급 인원 D-9341. 구미호 부대에 의해 사살됨.
ntf.bloodloss = D계급 인원 D-9341. 구미호 부대에 의해 총상을 입은 뒤에 출혈로 사망함.
tesla = D계급 인원 D-9341. [편집됨]에 있는 테슬라 게이트에 의해 사망함.
killbat = D계급 인원 D-9341이 SCP-914의 출력 칸막이 내부에서 평범한 9V 배터리로 보이는 무언가의 옆에서 사망한 채 발견되었다. 대상의 신체는 심각한 전기 화상의 흔적으로 뒤덮여 있었고, 배터리의 전격으로 인해 감전사한 걸로 추정된다. 배터리는 추가 연구를 위해 회수하였다.
killbat.outside = 피험자 D-9341이 [편집됨]에 있는 평범한 9V 배터리로 보이는 무언가의 옆에서 사망한 채 발견됨. 대상의 신체는 심각한 전기 화상의 흔적으로 뒤덮여 있었고, 배터리의 전격으로 인해 감전사한 걸로 추정된다. 배터리는 추가 연구를 위해 회수하였다.
suicide_1 = [편집됨]
suicide_2 = D계급 인원 D-9341이 섹터-[편집됨]에서 사망한 채 발견되었다. 대상에게는 신체적 손상이 전혀 없는 것으로 보이며, 사망 원인을 시사할 만한 흔적도 발견되지 않았다. 시신은 부검을 위해 이송되었다.
suicide_3 = 예외: 메모리_접근_위반
suicide_4 = D계급 인원 D-9341이 섹터-[편집됨] 구역에서 사망한 채 발견되었다. 대상은 자신의 피로 'kys'라는 글자를 적어 놓은 것으로 보인다. 그 외 신체적 외상이나 몸싸움의 흔적은 발견되지 않았다. 시신은 부검을 위해 이송되었다. 
gassed = [데이터 말소] 내부에서 D계급 인원 D-9341이 사망한 채로 발견됨. 사망 원인: 오염 제거를 위한 가스로 인한 질식. 

