[Option Tooltip]
; Graphics
vsync = "수직 동기화"는 디스플레이가 현재의 새로고침 주기를 마칠 때까지 기다린 후 다음 프레임을 계산함으로써, 화면 찢어짐과 같은 문제를 방지합니다. 이 과정에서 게임의 프레임이 디스플레이의 새로고침 주기와 동기화되며, 이로 인해 약간의 입력 지연이 발생할 수 있습니다.
antialias = "안티앨리어싱"은 렌더링된 이미지를 화면에 표시하기 전에 픽셀을 매끄럽게 다듬어 모델 가장자리에서 나타나는 계단 현상을 완화합니다.
gamma = "화면 감마"는 게임 화면이 지나치게 어둡거나 밝게 보일 때 디스플레이의 감마 값을 보정하여 적절한 밝기를 맞추는 데 사용됩니다. 이 값을 너무 높거나 낮게 설정하면 그래픽의 세부 묘사가 떨어져 보일 수 있습니다.
texlod = "텍스쳐 밉맵 보정"은 계단 현상을 방지하기 위해 텍스쳐 세부 정보가 변경되는 거리에 영향을 줍니다. 텍스쳐가 깜빡거리거나 지나치게 흐릿하게 보인다면 이 옵션을 변경해보십시오
vram = VRAM에 저장된 텍스쳐는 더 빠르게 불러와지지만, 이는 텍스쳐 품질에 부정적인 영향을 미치기도 합니다.
hudscalefactor ="HUD배율"은 스태미나 및 눈 깜빡임 게이지, 인벤토리, 그리고 각종 항목을 표시하는 HUD의 크기를 조절하는 데 사용됩니다. 설정 가능한 값의 범위는 해상도와 연동되어 있으며 이를 통해 HUD요소가 지나치게 작게 축소되는 일이 발생하지 않도록 방지합니다.
hudoffset = "HUD 오프셋"은 스태미나 및 눈 깜빡임 게이지를 비롯해 각종 아이템의 HUD를 화면 중앙 쪽으로 이동시키는 데 사용됩니다. 주로 울트라와이드 모니터 사용자를 위한 기능입니다.
viewbob = "카메라 흔들림"은 이동할 때 카메라 시점이 얼마나 흔들리고 기울어지는지를 조절합니다.
fov = "시야각(FOV)"은 게임 플레이 중 화면에 표시되는 시야의 범위를 의미합니다.

; Audio
musicvol = 배경 음악의 볼륨을 조절합니다. 슬라이더를 맨 왼쪽에 위치시키면 모든 음악이 음소거됩니다.
soundvol = 효과음의 볼륨을 조정합니다. 슬라이더를 맨 왼쪽에 위치시키면 모든 소리가 음소거됩니다.
localaudio = 음성 대사를 원본 영어 오디오로 재생할 지, 아니면 현재 설정된 언어에 맞는 오디오로 재생할지 선택합니다.
subtitles = 현재 재생중인 대사를 화면 하단에 텍스트로 표시합니다.
closedcaptions = 현재 재생중인 효과음을 설명하는 텍스트를 화면 하단에 표시합니다.
sfxautorelease = "미사용 사운드 자동 정리" 기능은 사운드가 5초 동안 사용되지 않을 경우 메모리에서 정리합니다. 이를 통해 메모리 할당 관련 문제를 방지할 수 있습니다.
usertrack = 라디오의 1번 채널을 통해 사용자 지정 사운드트랙을 재생할 수 있는 기능을 설정합니다. 해당 트랙들은 "SFX\Radio\UserTracks\" 폴더에서 불러옵니다. 라디오가 선택된 상태에서 "1"키를 누르면 트랙을 변경할 수 있습니다.
usertrackmode = 사용자 지정 사운드트랙 모드의 재생 방식을 성정합니다. "순차 재생"은 모든 파일을 알파벳 순으로 재생하며, "랜덤 재생"은 다음 트랙을 무작위로 선택합니다.
usertrackmode.note = 랜덤 재생 모드에서는 이전에 재생된 곡이 다시 재생될 수 있음을 유의하십시오.
usertrackscan = 사용자 지정 사운드트랙 폴더를 스캔하여 새로 추가되거나 삭제된 사운드 파일이 있는지 확인합니다.

; Controls
mousesensitivty = 마우스 포인터의 속도를 조절합니다.
mousesmoothing = 마우스 포인터가 부드럽게 움직이는 정도를 조정합니다.
binds = 게임 내 조작 방식을 설정하십시오.

; Advanced
showhud = 눈 깜빡임 게이지 및 스태미나 게이지를 표시합니다.
console = 개발자 콘솔 사용 여부를 설정합니다. 게임 내에서 {0} 키를 눌러 사용할 수 있습니다.
console.note = 콘솔을 사용하면 Steam 도전 과제가 비활성화됩니다.
speedrunmode = 타이머를 표시하며, 스피드런 요건에 맞춰 플레이 시간 측정 방식을 변경합니다.
numericseeds = 정수 형태의 시드 값을 입력할 수 있으며, 이 값은 게임 내부의 난수 생성기에 직접 사용됩니다. 시드 값을 입력하지 않을 경우, 컴퓨터가 부팅된 후 경과한 시간(밀리초 단위)이 시드 값으로 사용됩니다.
achpopup = 업적이 해금되었을 때 팝업 알림을 표시합니다.
launcher = 런처가 비활성화된 경우 이를 다시 활성화할 수 있게 해줍니다.
showfps = 왼쪽 상단 모서리에 FPS를 표시합니다.
framelimit = 프레임의 상한값을 설정합니다.
framelimit.note = 보통 60 FPS 이상이 권장됩니다. 이 설정에서 지나친 끊김 현상이 나타난다면, 설정을 낮추는 걸 권장합니다.

