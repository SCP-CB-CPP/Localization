safe = 안전
safe.desc = 언제든 게임을 저장할 수 있습니다. 하지만 SCP개체의 경우와 마찬가지로, 안전 등급이라고 해서 아무런 위협이 되지 않는다는 것은 아닙니다.
euclid = 유클리드
euclid.desc = 유클리드 난이도에서는 전원이 들어온 컴퓨터 화면이 있는 장소에서만 저장이 가능합니다. 유클리드 등급의 개체는 본질적으로 예측이 불가능하므로, 확실한 격리가 언제나 가능한 건 아닙니다.
keter = 케테르
keter.desc = 케테르 등급 개체는 재단이 격리하는 대상 중 가장 위험한 것으로 간주됩니다. 이 난이도 또한 마찬가지입니다. SCP들은 더욱 공격적으로 변하며 플레이어에게는 단 하나의 목숨만이 주어집니다. 사망하는 순간 게임오버입니다. 
